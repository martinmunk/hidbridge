; PlatformIO project for the HIDBRIDGE-esp32 firmware (BLE HID keyboard+mouse over USB serial).
;
; The firmware (src/main.cpp) targets NimBLE-Arduino 2.x, which needs the ESP32 Arduino core 3.x
; (IDF 5.x). PlatformIO's OFFICIAL `platform = espressif32` still ships Arduino core 2.x, so we use
; the maintained community fork `pioarduino` (pinned release) which provides core 3.x. That is the
; whole reason a contributor can flash this from a plain `pio run -t upload` and have iOS enable the
; HID input reports (dodging the BlueZ CCCD/Report-Reference bug the dongle path hits).
;
; Build / flash:
;   cd firmware/esp32
;   pio run                 # compile the default env (esp32dev)
;   pio run -t upload       # compile + flash the connected board (auto-detects the port)
;   pio device monitor -b 115200          # watch the serial protocol replies
; Wrapper with one-time setup + chip auto-detect: ./build_flash.sh [PORT]
;
; DETECTED BOARD on wsb (2026-07): classic ESP32-D0WDQ6 on a CP2102 bridge -> env:esp32dev.
; Other ESP32 variants: uncomment the matching env below (or pass -e), e.g.
;   pio run -e esp32-s3-devkitc-1 -t upload
; The Pico backend is a SEPARATE project (RP2040) owned by the sibling transport_pico.py agent.

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; NimBLE-Arduino 2.x = the iOS-compatible HID-over-GATT stack (correct CCCD/report-reference).
lib_deps = h2zero/NimBLE-Arduino@^2.2
; PER-BOND IDENTITY (host slots): hold >=2 centrals connected AT ONCE (one per slot), so ONE board
; holds mini5 AND mini6 on distinct BLE identities simultaneously. NimBLE's default is already 3;
; we pin it explicitly (main.cpp static_asserts CONFIG_BT_NIMBLE_MAX_CONNECTIONS >= NUM_SLOTS).
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3

[env:esp32dev]
board = esp32dev

; --- NETWORK backend: an ESP32 with a wired Ethernet PHY --------------------------------------- ;
; Same firmware + same line protocol, additionally served over TCP 3333 (mDNS: hidbridge-esp32.local)
; so the host can drive the HID target with no USB cable:
;   pio run -e esp32-ethernet-kit -t upload          # flash over the FT2232H UART channel
;   hidbridge net-provision --port /dev/ttyUSB3      # one-time: set the auth token over USB
;   hidbridge --backend net --host hidbridge-esp32.local type "hello"
; The TCP path is AUTHENTICATED and fails closed (no token provisioned = no network HID); the token
; can only be set over the physical serial cable. See the AUTH note in src/main.cpp.
;
; PHY defaults target the Espressif ESP32-Ethernet-Kit (IP101GRI, MDC=23 MDIO=18, PHY power GPIO5,
; 50MHz RMII clock IN on GPIO0). For a different Ethernet board, override the pins/PHY here rather
; than editing main.cpp -- e.g. Olimex ESP32-POE:
;   -DHB_ETH_PHY_TYPE=ETH_PHY_LAN8720 -DHB_ETH_PIN_POWER=12 -DHB_ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT
;
[env:esp32-ethernet-kit]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DHIDBRIDGE_NET

; --- other common ESP32 variants (uncomment the one matching your board) ---
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
