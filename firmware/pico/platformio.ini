; HIDBRIDGE-pico -- PlatformIO project for the Raspberry Pi Pico 2 W BLE HID backend.
;
; Board:    rpipico2w  (RP2350 + CYW43439 wireless)
; Core:     earlephilhower arduino-pico (BTstack-based BLE HID, iOS-compatible out of the box --
;           this is the whole point: it implements HID-over-GATT correctly where Linux BlueZ
;           gets stuck on the iOS CCCD / Report-Reference subscription quirk).
;
; Build + flash (put the Pico in BOOTSEL for the very first flash; after that the core reboots it
; automatically over USB):
;     pio run                       # compile
;     pio run -t upload             # compile + flash over USB
;     pio device monitor -b 115200  # watch the Pico's serial (READY/EV/OK lines)
;
; The host talks to this firmware over USB serial with python/src/hidbridge/transport_pico.py
; (bt_hid --backend pico ...). See firmware/pico/README.md.

[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Enable the BTstack Bluetooth (Classic + BLE) stack in the arduino-pico core.
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -I${PROJECT_DIR}/../shared           ; shared native rpc layer (hidbridge_rpc.h)
; ArduinoJson = the rpc wire protocol (JSON-RPC 2.0 over newline-delimited JSON).
lib_deps = bblanchon/ArduinoJson@^7.2
