name: firmware-release

# ---------------------------------------------------------------------------
# Build the firmware for a `fw/release/X.Y.Z` tag and attach the versioned images to a GitHub
# Release (tag name = the tag, title "firmware X.Y.Z").
#
# Releases are cut on Forgejo (the source of truth) by pushing a `fw/release/X.Y.Z` tag. Forgejo's
# own .forgejo/workflows/release-firmware.yml builds the same envs and publishes to the private
# generic registry; the Forgejo push mirror carries the same tag here and this workflow publishes the
# SAME files publicly. This mirrors release-firmware.yml step for step: same envs, same
# -DHB_FW_VERSION injection (baked into hello.fw), same artifact names
# (hidbridge-<env>-<version>.bin, hidbridge-pico-<version>.uf2).
#
# This file only runs on GitHub. Forgejo gives `.forgejo/workflows/` precedence and ignores
# `.github/workflows/` when both exist, so the two coexist safely. See PUBLISHING.md.
# ---------------------------------------------------------------------------

on:
  push:
    tags: ["fw/release/*"]
  workflow_dispatch:

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # gh release create

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/**/platformio.ini') }}

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Derive version from the tag
        # fw/release/1.2.3 -> 1.2.3. A workflow_dispatch run must be started ON a fw/release/* tag
        # (the "Use workflow from" picker); a branch run fails here by design.
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#fw/release/}"
          case "$GITHUB_REF_NAME" in
            fw/release/[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "ref $GITHUB_REF_NAME does not look like fw/release/<X.Y.Z>"; exit 1 ;;
          esac
          echo "firmware version = $VERSION (from ref $GITHUB_REF_NAME)"
          echo "FW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build ESP32 firmware (version injected into hello.fw)
        working-directory: firmware/esp32
        run: |
          set -eu
          # PLATFORMIO_BUILD_FLAGS is appended to EVERY env; the nested quotes make it a C string
          # literal. One `pio run` builds the envs sequentially (they share the scons state dir).
          export PLATFORMIO_BUILD_FLAGS="-DHB_FW_VERSION='\"${FW_VERSION}\"'"
          pio run -e esp32dev -e esp32-ethernet-kit -e esp32-wifi

      - name: Build Pico firmware (version injected into hello.fw)
        working-directory: firmware/pico
        run: |
          set -eu
          export PLATFORMIO_BUILD_FLAGS="-DHB_FW_VERSION='\"${FW_VERSION}\"'"
          pio run -e rpipico2w

      - name: Stage artifacts with versioned names
        run: |
          set -eu
          mkdir -p artifacts
          E=firmware/esp32/.pio/build
          P=firmware/pico/.pio/build
          cp "$E/esp32-ethernet-kit/firmware.bin" "artifacts/hidbridge-esp32-ethernet-kit-${FW_VERSION}.bin"
          cp "$E/esp32dev/firmware.bin"           "artifacts/hidbridge-esp32dev-${FW_VERSION}.bin"
          cp "$E/esp32-wifi/firmware.bin"         "artifacts/hidbridge-esp32-wifi-${FW_VERSION}.bin"
          cp "$P/rpipico2w/firmware.uf2"          "artifacts/hidbridge-pico-${FW_VERSION}.uf2"
          # The pico also emits a .bin; include it if present.
          [ -f "$P/rpipico2w/firmware.bin" ] && cp "$P/rpipico2w/firmware.bin" "artifacts/hidbridge-pico-${FW_VERSION}.bin" || true
          ls -l artifacts/

      - name: Create the GitHub Release (or add missing files to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run of a tag: idempotent, re-upload the files (--clobber) rather than fail.
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --title "firmware ${FW_VERSION}" \
              --notes "hidbridge firmware ${FW_VERSION} (hello.fw = ${FW_VERSION}). ESP32: flash the .bin with esptool / pio. Pico 2 W: drop the .uf2 onto the BOOTSEL drive."
          fi
