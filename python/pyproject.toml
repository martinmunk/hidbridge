[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hidbridge"
# Version is single-sourced from src/hidbridge/_version.py (baseline 1.0.0). The `wheel/release/<X.Y.Z>`
# release build rewrites that file from the git tag before `uv build` -- the tag is the source of
# truth. See docs/releasing.md.
dynamic = ["version"]
description = "Drive a Bluetooth-HID target (iPad / iPhone / any host) from Linux -- keyboard + pointer over the host BlueZ stack or a Pico 2W / ESP32 serial-attached BLE peripheral"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Munk Hansen" }]
keywords = ["bluetooth", "ble", "hid", "hog", "keyboard", "mouse", "ipad", "bluez", "pico", "esp32"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Human Interface Device (HID)",
]

# Core runtime is stdlib-only for the PURE report layer (hidbridge.reports).
# Backends pull extra deps -- install the extra(s) you need:
#   pip install "hidbridge[mcu]"      # Pico / ESP32 over USB serial (pyserial)
#   pip install "hidbridge[dongle]"   # the host's own BlueZ stack (dbus + PyGObject)
# On Debian/Ubuntu the dongle backend deps are usually the apt packages
# python3-dbus + python3-gi (system-python only); the [dongle] extra is provided
# for venvs built with --system-site-packages.
dependencies = []

[project.optional-dependencies]
mcu = ["pyserial>=3.5"]
dongle = ["dbus-python>=1.2", "PyGObject>=3.40"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0", "pyserial>=3.5"]

[project.scripts]
hidbridge = "hidbridge.cli:main"

[project.urls]
Homepage = "https://github.com/martinmunk/hidbridge"
Repository = "https://github.com/martinmunk/hidbridge"
Issues = "https://github.com/martinmunk/hidbridge/issues"

[tool.hatch.version]
# Single-source the version from the package (release build rewrites this file from the git tag).
path = "src/hidbridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hidbridge"]

[tool.hatch.build.targets.sdist]
include = ["src/hidbridge", "tests", "README.md", "LICENSE", "pyproject.toml"]

# --- lint: mirrors the source project's scoped ruleset (dense bit-parser style is deliberate) ---
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# EXPLICIT select (not extend-select): pin the exact rule scope so a ruff release that BROADENS its
# default set (0.16 did -- it started pulling RUF/S/SIM/UP/I/... and lit up 160 house-style "errors")
# cannot silently expand what CI enforces. This is pyflakes correctness (F) + the E4/E7/E9 + W subset,
# and nothing else; the dense one-liner report/bit style stays tolerated (see the ignore list below).
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E701", "E702", "E703",      # multi-statement one-liners: deliberate in the report/bit code
    "E401",                       # `import a,b,c`: deliberate house style
    "E402",                       # imports after a guarded block
    "E731", "E741",              # lambda-assign / ambiguous names (l, I, O): harmless here
    "F841",                       # unused locals often capture a parsed field with a side effect
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real hardware (BT adapter / MCU / iPad); deselected by default",
]
